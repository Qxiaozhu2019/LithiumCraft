x-backend-environment: &backend-environment
  APP_ENV: "${APP_ENV:-production}"
  API_PREFIX: "${API_PREFIX:-/api/v1}"
  DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://lithiumcraft:lithiumcraft@postgres:5432/lithiumcraft}"
  REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
  JWT_SECRET_KEY: "${JWT_SECRET_KEY:-change-this-in-production}"
  JWT_EXPIRE_MINUTES: "${JWT_EXPIRE_MINUTES:-720}"
  ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
  ADMIN_PASSWORD: "${ADMIN_PASSWORD:-ChangeMe123!}"
  CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:8080,http://localhost}"
  CRAWLER_USER_AGENT: "${CRAWLER_USER_AGENT:-LithiumCraftBot/0.1 (+https://example.com; compliance contact: ops@example.com)}"
  DEFAULT_DOMAIN_DELAY_SECONDS: "${DEFAULT_DOMAIN_DELAY_SECONDS:-3}"
  DEFAULT_DAILY_LIMIT: "${DEFAULT_DAILY_LIMIT:-100}"
  AI_PROVIDER: "${AI_PROVIDER:-stub}"
  AI_API_KEY: "${AI_API_KEY:-}"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-lithiumcraft}"
      POSTGRES_USER: "${POSTGRES_USER:-lithiumcraft}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-lithiumcraft}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../backend-api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["sh", "-c", "celery -A \"$${CELERY_APP_MODULE}\" worker --loglevel=\"$${CELERY_LOG_LEVEL}\""]
    healthcheck:
      disable: true
    environment:
      <<: *backend-environment
      CELERY_APP_MODULE: "${CELERY_APP_MODULE:-app.tasks.celery_app:celery_app}"
      CELERY_LOG_LEVEL: "${CELERY_LOG_LEVEL:-info}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ../backend-api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["sh", "-c", "celery -A \"$${CELERY_APP_MODULE}\" beat --loglevel=\"$${CELERY_LOG_LEVEL}\""]
    healthcheck:
      disable: true
    environment:
      <<: *backend-environment
      CELERY_APP_MODULE: "${CELERY_APP_MODULE:-app.tasks.celery_app:celery_app}"
      CELERY_LOG_LEVEL: "${CELERY_LOG_LEVEL:-info}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend-app
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: "${VITE_API_BASE:-/api/v1}"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_HTTP_BIND:-0.0.0.0}:${PUBLIC_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/lithiumcraft.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
